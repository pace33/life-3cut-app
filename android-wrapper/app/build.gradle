plugins {
    id "com.android.application"
}

android {
    namespace "net.aiedue.eeunphoto"
    compileSdk 37

    defaultConfig {
        applicationId "net.aiedue.eeunphoto"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

